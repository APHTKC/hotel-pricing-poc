name: Probe Shangri-La Taipei rates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scrapers/adapters/shangrila.py"
      - "config/hotels.shangrila-only.yaml"
      - "scripts/run_shangrila_once.py"
      - ".github/workflows/probe-shangrila-taipei.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Probe one Shangri-La stay date
        env:
          DEMO_MODE: "false"
          STORAGE_BACKEND: local
          LOCAL_DATA_PATH: data/shangrila-probe.jsonl
          HOTELS_CONFIG_PATH: config/hotels.shangrila-only.yaml
          LEAD_DAYS: "30"
        run: python -m scripts.run_shangrila_once
      - name: Save probe observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shangrila-taipei-rate-probe
          path: data/shangrila-probe.jsonl
          if-no-files-found: warn
