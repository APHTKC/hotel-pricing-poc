name: Probe Grand Mayfull Taipei rates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_grand_mayfull_taipei.py"
      - "tests/test_grand_mayfull_probe.py"
      - ".github/workflows/probe-grand-mayfull-taipei.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Test booking URL
        run: pytest -q tests/test_grand_mayfull_probe.py
      - name: Probe Grand Mayfull Taipei public rates
        run: xvfb-run -a python -m scripts.probe_grand_mayfull_taipei
      - name: Save diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-mayfull-taipei-rate-probe
          path: artifacts/
          if-no-files-found: warn
