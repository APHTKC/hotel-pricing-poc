name: Daily Taiwan hotel rates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config/hotels.daily.yaml"
      - "scrapers/adapters/**"
      - "scripts/run_daily_once.py"
      - "requirements.txt"
      - ".github/workflows/daily-capella.yml"
  schedule:
    # GitHub Actions uses UTC. 22:00 UTC = 06:00 Asia/Taipei next day.
    - cron: "0 22 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: taiwan-rates-and-pages
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Collect six stay dates for active hotels
        env:
          DEMO_MODE: "false"
          STORAGE_BACKEND: local
          LOCAL_DATA_PATH: data/rates.jsonl
          HOTELS_CONFIG_PATH: config/hotels.daily.yaml
          LEAD_DAYS: "1,7,14,30,60,90"
        run: python -m scripts.run_daily_once

      - name: Build static dashboard data
        run: python -m scripts.build_static_data

      - name: Update Google Finance currency rates
        run: python -m scripts.update_google_fx

      - name: Save new rate history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.jsonl public/data/rates.json public/data/latest.json public/data/fx.json
          git diff --cached --quiet || git commit -m "data: update Taiwan hotel rates"
          git pull --rebase origin main
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
