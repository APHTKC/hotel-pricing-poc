name: Daily Taiwan hotel rates

on:
  workflow_dispatch:
  schedule:
    # GitHub Actions uses UTC. 22:00 UTC = 06:00 Asia/Taipei next day.
    - cron: "0 22 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: taiwan-rates-and-pages
  cancel-in-progress: false

jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4

      # A queued push run can start from an older commit after a previous run
      # has already appended rate history.  Sync first so the new observations
      # are added to the latest dataset instead of conflicting at publish time.
      - name: Sync latest rate history
        run: git pull --rebase origin main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Update Google Finance currency rates
        run: python -m scripts.update_google_fx

      - name: Collect six stay dates for active hotels
        env:
          DEMO_MODE: "false"
          STORAGE_BACKEND: local
          LOCAL_DATA_PATH: data/rates.jsonl
          ADAPTER_HEALTH_PATH: data/adapter_health.json
          DIAGNOSTIC_SNAPSHOT_DIR: data/diagnostics
          HOTELS_CONFIG_PATH: config/hotels.daily.yaml
          LEAD_DAYS: "1,7,14,30,60,90"
        run: python -m scripts.run_daily_once

      - name: Collect configured Booking.com partner rates
        env:
          DEMO_MODE: "false"
          STORAGE_BACKEND: local
          LOCAL_DATA_PATH: data/rates.jsonl
          ADAPTER_HEALTH_PATH: data/adapter_health.json
          DIAGNOSTIC_SNAPSHOT_DIR: data/diagnostics
          HOTELS_CONFIG_PATH: config/hotels.daily.yaml
          OTA_CONFIG_PATH: config/ota-properties.yaml
          LEAD_DAYS: "1,7,14,30,60,90"
          BOOKING_COM_API_KEY: ${{ secrets.BOOKING_COM_API_KEY }}
          BOOKING_COM_AFFILIATE_ID: ${{ secrets.BOOKING_COM_AFFILIATE_ID }}
        run: python -m scripts.run_ota_once

      - name: Build static dashboard data
        run: |
          python -m scripts.deduplicate_rate_history
          python -m scripts.build_static_data
          python -m scripts.build_hotel_catalog

      - name: Save new rate history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rates.jsonl data/adapter_health.json public/data
          git diff --cached --quiet || git commit -m "data: update Taiwan hotel rates"
          git pull --rebase origin main
          git push

      - name: Upload sanitized scraper diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scraper-diagnostics-${{ github.run_id }}
          path: data/diagnostics
          if-no-files-found: ignore
          retention-days: 7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload dashboard
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
