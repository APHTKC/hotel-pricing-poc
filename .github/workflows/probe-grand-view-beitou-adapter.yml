name: Probe Grand View Resort Beitou adapter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scrapers/adapters/grand_view.py"
      - "scrapers/registry.py"
      - "scripts/run_grand_view_once.py"
      - "config/hotels.grand-view-beitou-only.yaml"
      - ".github/workflows/probe-grand-view-beitou-adapter.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Collect one public stay date
        env:
          DEMO_MODE: "false"
          STORAGE_BACKEND: local
          LOCAL_DATA_PATH: data/grand-view-beitou-probe.jsonl
        run: python -m scripts.run_grand_view_once
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grand-view-beitou-adapter-probe
          path: data/grand-view-beitou-probe.jsonl
          if-no-files-found: ignore
