name: Probe K Hotel Taipei Songjiang rates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/run_k_hotel_songjiang_once.py"
      - "config/hotels.k-hotel-songjiang-only.yaml"
      - ".github/workflows/probe-k-hotel-songjiang.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Collect one public stay date
        env:
          DEMO_MODE: "false"
          STORAGE_BACKEND: local
          LOCAL_DATA_PATH: data/k-hotel-songjiang-local-probe.jsonl
          LEAD_DAYS: "30"
        run: python -m scripts.run_k_hotel_songjiang_once
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k-hotel-songjiang-rate-probe
          path: data/k-hotel-songjiang-local-probe.jsonl
          if-no-files-found: ignore
