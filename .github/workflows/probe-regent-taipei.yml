name: Probe Regent Taipei rates

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Probe one public stay date
        env:
          DEMO_MODE: "false"
          STORAGE_BACKEND: local
          LOCAL_DATA_PATH: data/regent-probe.jsonl
        run: python -m scripts.run_regent_once
      - uses: actions/upload-artifact@v4
        with:
          name: regent-taipei-rate-probe
          path: data/regent-probe.jsonl
