name: Probe Grand Hyatt Taipei booking page

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/probe_grand_hyatt_taipei.py"
      - ".github/workflows/probe-grand-hyatt-taipei.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Probe a Grand Hyatt Taipei public stay date
        run: xvfb-run -a python -m scripts.probe_grand_hyatt_taipei
      - name: Save diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: grand-hyatt-taipei-booking-probe
          path: artifacts/
          if-no-files-found: warn
