name: Publish dashboard only

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "public/**"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: taiwan-rates-and-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -r requirements.txt
      - name: Validate dashboard release
        run: python -m pytest -q
      - name: Generate deployment metadata
        run: python -m scripts.build_site_meta
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: pip install -r requirements.txt
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify public dashboard
        run: >-
          python -m scripts.verify_pages_deployment
          --url "${{ steps.deployment.outputs.page_url }}"
          --expected-build "${GITHUB_SHA::7}"
