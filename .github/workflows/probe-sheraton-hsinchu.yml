name: Probe Sheraton Hsinchu booking page

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Probe Sheraton Hsinchu official public rates
        env:
          MARRIOTT_PROPERTY_CODE: TPEHS
          MARRIOTT_HOTEL_NAME: Sheraton Hsinchu Hotel
          MARRIOTT_ARTIFACT_SLUG: sheraton-hsinchu
        run: xvfb-run -a python -m scripts.probe_w_taipei
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sheraton-hsinchu-booking-probe
          path: artifacts/
          if-no-files-found: warn
