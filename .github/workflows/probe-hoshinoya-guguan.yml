name: Probe HOSHINOYA Guguan rates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scrapers/adapters/hoshinoya.py"
      - "scrapers/registry.py"
      - "scripts/run_hoshinoya_probe.py"
      - "config/hotels.hoshinoya-guguan-only.yaml"
      - ".github/workflows/probe-hoshinoya-guguan.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Collect one public stay date
        env:
          DEMO_MODE: "false"
          STORAGE_BACKEND: local
          LOCAL_DATA_PATH: data/hoshinoya-guguan-probe.jsonl
          LEAD_DAYS: "30"
        run: python -m scripts.run_hoshinoya_probe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hoshinoya-guguan-rate-probe
          path: data/hoshinoya-guguan-probe.jsonl
          if-no-files-found: ignore
