name: Bootstrap hotel pricing project

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore project files
        shell: bash
        run: |
          printf '%s' '' | base64 --decode > /tmp/hotel-pricing.zip
          unzip -o /tmp/hotel-pricing.zip -d .
          rm -f .github/workflows/bootstrap.yml
      - name: Commit project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Initial Luxury Hotel Pricing Intelligence System"
          git push
