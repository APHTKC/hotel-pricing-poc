name: Probe Hotel Nikko Kaohsiung rates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scrapers/adapters/synxis.py"
      - "scripts/run_nikko_kaohsiung_once.py"
      - "config/hotels.nikko-kaohsiung-only.yaml"
      - ".github/workflows/probe-nikko-kaohsiung.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Collect one public stay date
        env:
          DEMO_MODE: "false"
          STORAGE_BACKEND: local
          LOCAL_DATA_PATH: data/nikko-kaohsiung-probe.jsonl
        run: python -m scripts.run_nikko_kaohsiung_once
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nikko-kaohsiung-rate-probe
          path: data/nikko-kaohsiung-probe.jsonl
          if-no-files-found: ignore
