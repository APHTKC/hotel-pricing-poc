name: Probe Royal-Nikko Taipei adapter

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scrapers/adapters/royal_nikko.py"
      - "scripts/run_royal_nikko_once.py"
      - "config/hotels.royal-nikko-taipei-only.yaml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          pip install -r requirements.txt
          playwright install --with-deps chromium
      - name: Collect one public stay date
        env:
          DEMO_MODE: "false"
          STORAGE_BACKEND: local
          LOCAL_DATA_PATH: data/royal-nikko-taipei-probe.jsonl
        run: python -m scripts.run_royal_nikko_once
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: royal-nikko-taipei-adapter-probe
          path: data/royal-nikko-taipei-probe.jsonl
          if-no-files-found: ignore
