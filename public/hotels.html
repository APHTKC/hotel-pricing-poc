function loungeValue(profile){if(!profile)return`<span class="pending-value">${T[lang].unknown}</span>`;return profile.lounge?.available?`<span class="yes">✓</span>`:T[lang].no}
function loungeDetail(profile){if(!profile)return T[lang].unknown;if(!profile.lounge?.available)return T[lang].no;const note=profile.lounge.kind==='guest_living_room'?T[lang].guestLivingRoom:profile.lounge.kind==='members_club'?T[lang].membersOnlyLounge:'';return`${esc(profile.lounge.name)}${note?` · ${note}`:''}`}
function setFilters(){const values=Object.fromEntries(['city','feature','verification','rateStatus','sort'].map(id=>[id,document.querySelector('#'+id).value])),cities=[...new Set(catalog.map(h=>h.city).filter(Boolean))].sort((a,b)=>cityRank(a)-cityRank(b)||cityName(a).localeCompare(cityName(b),locale[lang])),city=document.querySelector('#city');city.innerHTML=`<option value="">${T[lang].allCities}</option>`+cities.map(v=>`<option value="${esc(v)}">${esc(cityName(v))}</option>`).join('');document.querySelector('#feature').innerHTML=`<option value="">${T[lang].allFeatures}</option><option value="pool">${T[lang].withPool}</option><option value="spa">${T[lang].withSpa}</option><option value="lounge">${T[lang].withLounge}</option>`;document.querySelector('#verification').innerHTML=`<option value="">${T[lang].allStatus}</option><option value="verified">${T[lang].verifiedOnly}</option><option value="pending">${T[lang].pendingOnly}</option>`;document.querySelector('#rateStatus').innerHTML=`<option value="">${T[lang].allRateStatus}</option><option value="with">${T[lang].withRates}</option><option value="without">${T[lang].withoutRates}</option>`;document.querySelector('#sort').innerHTML=`<option value="geo">${T[lang].sortGeo}</option><option value="name">${T[lang].sortName}</option><option value="rooms">${T[lang].sortRooms}</option><option value="size">${T[lang].sortSize}</option><option value="restaurants">${T[lang].sortDining}</option><option value="status">${T[lang].sortVerified}</option>`;Object.entries(values).forEach(([id,value])=>{const select=document.querySelector('#'+id);if([...select.options].some(option=>option.value===value))select.value=value});document.querySelector('#sort').value=profileSort.key}
function hotelFacts(h){const p=profiles.get(h.id),rooms=roomRows(h.id),sizes=rooms.map(r=>r.size).filter(Number.isFinite);return{h,p,rooms,minSize:sizes.length?Math.min(...sizes):null,maxSize:sizes.length?Math.max(...sizes):null,restaurants:p?.restaurants.length??null,verified:p?1:0}}
function filteredHotels(){const city=document.querySelector('#city').value,feature=document.querySelector('#feature').value,status=document.querySelector('#verification').value,rateStatus=document.querySelector('#rateStatus').value;return catalog.map(hotelFacts).filter(item=>{const {h,p,rooms}=item;if(city&&h.city!==city)return false;if((status==='verified'&&!p)||(status==='pending'&&p))return false;if(rateStatus==='with'&&!rooms.length||rateStatus==='without'&&rooms.length)return false;if(feature==='lounge'&&!p?.lounge?.available)return false;if(feature&&feature!=='lounge'&&!p?.facilities?.[feature])return false;return true})}
function sortHotels(items){const direction=profileSort.direction==='asc'?1:-1,key=profileSort.key;return items.sort((a,b)=>{if(key==='geo')return direction*(cityRank(a.h.city)-cityRank(b.h.city))||hotelName(a.h).localeCompare(hotelName(b.h),locale[lang]);if(key==='name')return direction*hotelName(a.h).localeCompare(hotelName(b.h),locale[lang]);const av=key==='rooms'?a.rooms.length:key==='size'?(a.maxSize??-1):key==='restaurants'?(a.restaurants??-1):a.verified,bv=key==='rooms'?b.rooms.length:key==='size'?(b.maxSize??-1):key==='restaurants'?(b.restaurants??-1):b.verified;return direction*(av-bv)||cityRank(a.h.city)-cityRank(b.h.city)||hotelName(a.h).localeCompare(hotelName(b.h),locale[lang])})}
function renderTable(){const liveIds=new Set(rates.map(r=>r.hotel_id)),items=sortHotels(filteredHotels());document.querySelector('#registered').textContent=catalog.length;document.querySelector('#liveRates').textContent=liveIds.size;document.querySelector('#verifiedProfiles').textContent=profiles.size;document.querySelectorAll('.sort-button').forEach(button=>{const arrow=button.querySelector('.sort-arrow'),active=button.dataset.sort===profileSort.key;arrow.textContent=active?(profileSort.direction==='asc'?'▲':'▼'):'';button.setAttribute('aria-sort',active?(profileSort.direction==='asc'?'ascending':'descending'):'none')});document.querySelector('#comparison').innerHTML=items.length?items.map(({h,p,rooms,minSize,maxSize})=>{const range=minSize!=null?`${minSize}–${maxSize}㎡`:'—',color=cityColor(h.city);return`<tr class="city-row" style="--city-color:${color}"><td><strong>${esc(hotelName(h))}</strong></td><td><span class="city-badge">${esc(cityName(h.city))}</span></td><td class="num">${rooms.length||'—'}</td><td class="num">${range}</td><td class="num">${p?p.restaurants.length:T[lang].unknown}</td><td class="center">${facilityValue(p,'pool')}</td><td class="center">${facilityValue(p,'fitness')}</td><td class="center">${facilityValue(p,'spa')}</td><td class="center">${loungeValue(p)}</td><td><span class="status ${p?'verified':'pending'}">${p?T[lang].verified:T[lang].pending}</span></td><td><button class="view-button" data-hotel="${esc(h.id)}">${T[lang].view}</button></td></tr>`}).join(''):`<tr><td colspan="11" class="empty">—</td></tr>`;document.querySelectorAll('[data-hotel]').forEach(button=>button.addEventListener('click',()=>{selectedId=button.dataset.hotel;renderDetail();document.querySelector('#detail').scrollIntoView({behavior:'smooth',block:'start'})}))}
function renderDetail(){const h=catalog.find(item=>item.id===selectedId)||catalog[0];if(!h)return;selectedId=h.id;const p=profiles.get(h.id),rooms=roomRows(h.id),features=p?[['pool',T[lang].pool],['fitness',T[lang].fitness],['spa','SPA'],['sauna','Sauna'],['steam_room','Steam room']].map(([key,label])=>`<li>${esc(label)}：${p.facilities?.[key]?T[lang].yes:T[lang].no}</li>`).join(''):`<li>${T[lang].noProfile}</li>`,lounge=loungeDetail(p);document.querySelector('#detail').innerHTML=`<div class="detail-head"><div><h2>${esc(hotelName(h))}</h2><div class="detail-meta">${esc(cityName(h.city))}${p?` · ${T[lang].verifiedDate} ${esc(p.verified_at)}`:''}${p?.room_inventory?` · ${T[lang].inventory} ${p.room_inventory}`:''}</div></div><a class="official-link" href="${esc(h.booking_url)}" target="_blank" rel="noopener noreferrer">${T[lang].official} ↗</a></div><div class="detail-grid"><section class="detail-section"><h3>${T[lang].dining}</h3>${p?`<ul class="restaurant-list">${p.restaurants.map(r=>`<li><strong>${esc(r.name)}</strong> · ${esc(r[`type_${lang}`]||r.type_en)}</li>`).join('')}</ul>`:`<p>${T[lang].noProfile}</p>`}</section><section class="detail-section"><h3>${T[lang].facilities}</h3><ul class="fact-list">${features}<li>${T[lang].lounge}：${lounge}</li></ul></section><section class="detail-section"><h3>${T[lang].sources}</h3>${p?`<ul class="source-list">${p.source_urls.map((url,i)=>`<li><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${T[lang].official} ${i+1} ↗</a></li>`).join('')}</ul>`:`<p>${T[lang].noProfile}</p>`}</section><section class="detail-section"><h3>${T[lang].dataStatus}</h3><p><span class="status ${p?'verified':'pending'}">${p?T[lang].verified:T[lang].pending}</span></p></section><section class="room-table"><h3>${T[lang].roomsAndSizes}</h3>${rooms.length?`<div class="table-wrap"><table><thead><tr><th>${T[lang].roomTypes}</th><th class="num">${T[lang].sizeRange}</th><th class="num">${T[lang].observedMedian}</th><th class="num">${T[lang].rateObservations}</th></tr></thead><tbody>${rooms.map(r=>`<tr><td>${esc(r.name)}</td><td class="num">${r.size==null?'—':`${r.size}㎡`}</td><td class="num">${money(median(r.values))}</td><td class="num">${r.values.length.toLocaleString(locale[lang])}</td></tr>`).join('')}</tbody></table></div>`:`<p>${T[lang].noRateRooms}</p>`}</section></div>`}
function translate(){document.documentElement.lang=lang==='zh'?'zh-Hant':lang;document.title=T[lang].title+' · Taiwan Hotel Rate Search Platform';document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T[lang][el.dataset.i18n]);setFilters();renderTable();renderDetail();document.querySelector('#updated').textContent=T[lang].updated+(profileUpdated||'—')}
let profileUpdated='';const loadJson=p=>fetch(p+'?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()});Promise.all([loadJson('./data/hotels.json'),loadJson('./data/latest.json').catch(()=>({rates:[]})),loadJson('./data/hotel_profiles.json'),loadJson('./data/hotel_names_zh.json'),loadJson('./data/fx.json').catch(()=>({rates:fx}))]).then(([hotelsData,ratesData,profilesData,namesData,fxData])=>{catalog=hotelsData.hotels||[];rates=ratesData.rates||[];profiles=new Map((profilesData.profiles||[]).map(p=>[p.hotel_id,p]));namesZh=namesData.names||{};fx=fxData.rates||fx;profileUpdated=profilesData.updated_at;selectedId=location.hash.slice(1)||'capella_taipei';document.querySelector('#language').value=lang;document.querySelector('#currency').value=currency;translate()}).catch(error=>{document.querySelector('#detail').innerHTML=`<div class="empty">${esc(error.message)}</div>`});document.querySelector('#language').addEventListener('change',e=>{lang=e.target.value;localStorage.setItem('hotel-lang',lang);translate()});document.querySelector('#currency').addEventListener('change',e=>{currency=e.target.value;localStorage.setItem('hotel-currency',currency);renderDetail()});['city','feature','verification','rateStatus'].forEach(id=>document.querySelector('#'+id).addEventListener('change',renderTable));document.querySelector('#sort').addEventListener('change',event=>{const key=event.target.value;profileSort={key,direction:['rooms','size','restaurants','status'].includes(key)?'desc':'asc'};renderTable()});document.querySelectorAll('.sort-button').forEach(button=>button.addEventListener('click',()=>{const key=button.dataset.sort;profileSort=key===profileSort.key?{key,direction:profileSort.direction==='asc'?'desc':'asc'}:{key,direction:['rooms','size','restaurants','status'].includes(key)?'desc':'asc'};document.querySelector('#sort').value=key;renderTable()}));
</script>
</body></html>
