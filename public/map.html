function popup(row){const hist=historyByHotel.get(row.hotel_id),area=view==='taipei'?label(DISTRICT_LABELS,row.district):label(CITY_LABELS,row.city);return `<div class="popup-title">${esc(hotelName(row))}</div><div class="popup-meta">${esc(area)}${row.daily_tracked?` · ${esc(T[lang].tracked)}`:''}</div><div class="popup-price">${hist?fmtMoney(hist.median_twd):esc(T[lang].noPrice)}</div><div class="popup-meta">${esc(T[lang].historyMedian)}</div><div class="popup-links"><a href="./hotels.html#${encodeURIComponent(row.hotel_id)}">${esc(T[lang].profile)}</a><a href="${esc(row.booking_url)}" target="_blank" rel="noopener noreferrer">${esc(T[lang].booking)}</a></div>`}
function renderKey(rows){const keys=[...new Set(rows.map(x=>view==='taipei'?x.district:x.city).filter(Boolean))];const order=view==='taipei'?Object.keys(DISTRICT_LABELS):CITY_ORDER;document.querySelector('#mapKey').innerHTML=order.filter(x=>keys.includes(x)).map(x=>`<span class="key-item"><i class="key-dot" style="--dot:${color(view==='taipei'?{district:x}:{city:x})}"></i>${esc(label(view==='taipei'?DISTRICT_LABELS:CITY_LABELS,x))}</span>`).join('')+`<span class="key-item"><i class="key-dot outline"></i>${esc(T[lang].catalogOnly)}</span>`}
function render(){const rows=selectedRows();document.querySelector('#shownHotels').textContent=rows.length;document.querySelector('#trackedHotels').textContent=rows.filter(x=>x.daily_tracked).length;document.querySelector('#withHistory').textContent=rows.filter(x=>historyByHotel.has(x.hotel_id)).length;document.querySelector('#areas').textContent=new Set(rows.map(x=>view==='taipei'?x.district:x.city).filter(Boolean)).size;document.querySelector('#mapTitle').textContent=T[lang][view==='taipei'?'taipeiView':'taiwanView'];document.querySelector('#listHint').textContent=`${rows.length} ${T[lang].shownHotels}`;renderKey(rows);layerGroup.clearLayers();const bounds=[];rows.forEach(row=>{const marker=L.circleMarker([row.latitude,row.longitude],{radius:row.daily_tracked?8:6,color:'#222',weight:1,fillColor:color(row),fillOpacity:row.daily_tracked?.9:.48}).bindPopup(popup(row));marker.on('click',()=>marker.setPopupContent(popup(row)));marker.addTo(layerGroup);bounds.push([row.latitude,row.longitude]);row._marker=marker});if(bounds.length)map.fitBounds(bounds,{padding:[28,28],maxZoom:view==='taipei'?13:9});else map.setView(view==='taipei'?[25.06,121.54]:[23.75,120.95],view==='taipei'?11:7);const sorted=[...rows].sort((a,b)=>CITY_ORDER.indexOf(a.city)-CITY_ORDER.indexOf(b.city)||(a.district||'').localeCompare(b.district||'')||hotelName(a).localeCompare(hotelName(b),locale[lang]));document.querySelector('#hotelList').innerHTML=sorted.length?sorted.map(row=>{const hist=historyByHotel.get(row.hotel_id),area=label(view==='taipei'?DISTRICT_LABELS:CITY_LABELS,view==='taipei'?row.district:row.city);return `<button type="button" class="hotel-row" data-id="${esc(row.hotel_id)}"><i class="dot" style="--dot:${color(row)}"></i><span><strong>${esc(hotelName(row))}</strong><small>${esc(area)}</small>${row.daily_tracked?`<em class="tracked-tag">${esc(T[lang].tracked)}</em>`:''}</span><span class="price">${hist?fmtMoney(hist.median_twd):esc(T[lang].noPrice)}</span></button>`}).join(''):`<div class="empty">${esc(T[lang].noPrice)}</div>`;document.querySelectorAll('.hotel-row').forEach(button=>button.addEventListener('click',()=>{const row=rows.find(x=>x.hotel_id===button.dataset.id);if(row?._marker){map.flyTo([row.latitude,row.longitude],Math.max(map.getZoom(),view==='taipei'?14:11));row._marker.openPopup()}}))}
const openingLabel=row=>row[`expected_opening_${lang}`]||row.expected_opening_en||T[lang].upcoming;
popup=function(row){const hist=historyByHotel.get(row.hotel_id),area=view==='taipei'?label(DISTRICT_LABELS,row.district):label(CITY_LABELS,row.city),upcoming=row.opening_status==='upcoming',sourceLink=row.booking_url||row.source_url;return `<div class="popup-title">${esc(hotelName(row))}</div><div class="popup-meta">${esc(area)}${row.daily_tracked?` · ${esc(T[lang].tracked)}`:''}</div>${upcoming?`<div class="popup-upcoming">${esc(T[lang].upcoming)} · ${esc(openingLabel(row))}</div><div class="popup-meta">${esc(T[lang].projectLocationNote)}</div>`:`<div class="popup-price">${hist?fmtMoney(hist.median_twd):esc(T[lang].noPrice)}</div><div class="popup-meta">${esc(T[lang].historyMedian)}</div>`}<div class="popup-links"><a href="./hotels.html#${encodeURIComponent(row.hotel_id)}">${esc(T[lang].profile)}</a>${sourceLink?`<a href="${esc(sourceLink)}" target="_blank" rel="noopener noreferrer">${esc(T[lang].booking)}</a>`:''}</div>`};
renderKey=function(rows){const keys=[...new Set(rows.map(x=>view==='taipei'?x.district:x.city).filter(Boolean))],order=view==='taipei'?Object.keys(DISTRICT_LABELS):CITY_ORDER,hasUpcoming=rows.some(row=>row.opening_status==='upcoming'),hasCatalog=rows.some(row=>!row.daily_tracked&&row.opening_status!=='upcoming');document.querySelector('#mapKey').innerHTML=order.filter(x=>keys.includes(x)).map(x=>`<span class="key-item"><i class="key-dot" style="--dot:${color(view==='taipei'?{district:x}:{city:x})}"></i>${esc(label(view==='taipei'?DISTRICT_LABELS:CITY_LABELS,x))}</span>`).join('')+(hasCatalog?`<span class="key-item"><i class="key-dot outline"></i>${esc(T[lang].catalogOnly)}</span>`:'')+(hasUpcoming?`<span class="key-item"><i class="key-dot upcoming-key"></i>${esc(T[lang].upcoming)}</span>`:'')};
render=function(){const rows=selectedRows();document.querySelector('#shownHotels').textContent=rows.length;document.querySelector('#trackedHotels').textContent=rows.filter(x=>x.daily_tracked).length;document.querySelector('#withHistory').textContent=rows.filter(x=>historyByHotel.has(x.hotel_id)).length;document.querySelector('#areas').textContent=new Set(rows.map(x=>view==='taipei'?x.district:x.city).filter(Boolean)).size;document.querySelector('#mapTitle').textContent=T[lang][view==='taipei'?'taipeiView':'taiwanView'];document.querySelector('#listHint').textContent=`${rows.length} ${T[lang].shownHotels}`;renderKey(rows);layerGroup.clearLayers();const bounds=[];rows.forEach(row=>{const upcoming=row.opening_status==='upcoming',marker=L.circleMarker([row.latitude,row.longitude],{radius:upcoming?8:row.daily_tracked?8:6,color:upcoming?'#a6192e':'#222',weight:upcoming?2:1,dashArray:upcoming?'4 3':null,fillColor:upcoming?'#fff':color(row),fillOpacity:upcoming?.75:row.daily_tracked?.9:.48}).bindPopup(popup(row));marker.on('click',()=>marker.setPopupContent(popup(row)));marker.addTo(layerGroup);bounds.push([row.latitude,row.longitude]);row._marker=marker});if(bounds.length)map.fitBounds(bounds,{padding:[28,28],maxZoom:view==='taipei'?13:9});else map.setView(view==='taipei'?[25.06,121.54]:[23.75,120.95],view==='taipei'?11:7);const sorted=[...rows].sort((a,b)=>CITY_ORDER.indexOf(a.city)-CITY_ORDER.indexOf(b.city)||(a.district||'').localeCompare(b.district||'')||hotelName(a).localeCompare(hotelName(b),locale[lang]));document.querySelector('#hotelList').innerHTML=sorted.length?sorted.map(row=>{const hist=historyByHotel.get(row.hotel_id),area=label(view==='taipei'?DISTRICT_LABELS:CITY_LABELS,view==='taipei'?row.district:row.city),upcoming=row.opening_status==='upcoming';return `<button type="button" class="hotel-row${upcoming?' upcoming-row':''}" data-id="${esc(row.hotel_id)}"><i class="dot${upcoming?' upcoming-dot':''}" style="--dot:${color(row)}"></i><span><strong>${esc(hotelName(row))}</strong><small>${esc(area)}</small>${row.daily_tracked?`<em class="tracked-tag">${esc(T[lang].tracked)}</em>`:''}${upcoming?`<em class="upcoming-tag">${esc(T[lang].upcoming)}</em>`:''}</span><span class="price">${upcoming?esc(openingLabel(row)):hist?fmtMoney(hist.median_twd):esc(T[lang].noPrice)}</span></button>`}).join(''):`<div class="empty">${esc(T[lang].noPrice)}</div>`;document.querySelectorAll('.hotel-row').forEach(button=>button.addEventListener('click',()=>{const row=rows.find(x=>x.hotel_id===button.dataset.id);if(row?._marker){map.flyTo([row.latitude,row.longitude],Math.max(map.getZoom(),view==='taipei'?14:11));row._marker.openPopup()}}))};
function translate(){document.documentElement.lang=lang==='zh'?'zh-Hant':lang;document.title=T[lang].title+' · '+(lang==='zh'?'台灣飯店房價查詢平台':'Taiwan Hotel Rate Search Platform');document.querySelectorAll('[data-i18n]').forEach(el=>{const value=T[lang][el.dataset.i18n];if(value)el.textContent=value});setFilterOptions();setGeoOptions();render()}
function switchView(next){view=next;document.querySelectorAll('.view-tabs button').forEach(button=>button.classList.toggle('active',button.dataset.view===view));setGeoOptions();render();setTimeout(()=>map.invalidateSize(),0)}
const loadJson=path=>fetch(path+'?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()});
if(!window.L){document.querySelector('#map').innerHTML='<div class="empty">Map library unavailable</div>'}else{map=L.map('map',{zoomControl:true,attributionControl:true}).setView([23.75,120.95],7);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);layerGroup=L.layerGroup().addTo(map);Promise.all([loadJson('./data/hotel_locations.json'),loadJson('./data/upcoming_hotels.json').catch(()=>({hotels:[]})),loadJson('./data/upcoming_hotel_locations.json').catch(()=>({locations:[]})),loadJson('./data/history_summary.json').catch(()=>({hotels:[]})),loadJson('./data/fx.json').catch(()=>({rates:fx}))]).then(([locationData,upcomingData,upcomingLocationData,historyData,fxData])=>{const upcomingById=new Map((upcomingData.hotels||[]).map(hotel=>[hotel.id,hotel]));const futureRows=(upcomingLocationData.locations||[]).map(point=>{const hotel=upcomingById.get(point.hotel_id);if(!hotel)return null;return{...point,hotel_id:hotel.id,name_zh:hotel.name_zh,name_en:hotel.name,city:hotel.city,district:hotel.district||null,booking_url:(hotel.source_urls||[])[0]||'',source_url:(hotel.source_urls||[])[0]||'',daily_tracked:false,opening_status:'upcoming',expected_opening_zh:hotel.expected_opening_zh,expected_opening_en:hotel.expected_opening_en,expected_opening_ja:hotel.expected_opening_ja}}).filter(Boolean);locations=[...(locationData.locations||[]),...futureRows.filter(future=>!(locationData.locations||[]).some(current=>current.hotel_id===future.hotel_id))];historyByHotel=new Map((historyData.hotels||[]).map(x=>[x.hotel_id,x]));fx=fxData.rates||fx;mapUpdatedAt=upcomingLocationData.updated_at||locationData.updated_at||'—';document.querySelector('#updated').textContent=T[lang].updated+mapUpdatedAt;document.querySelector('#language').value=lang;document.querySelector('#currency').value=currency;setFilterOptions();setGeoOptions();translate()}).catch(error=>{document.querySelector('#hotelList').innerHTML=`<div class="empty">${esc(T[lang].loadError+error.message)}</div>`})}
document.querySelectorAll('.view-tabs button').forEach(button=>button.addEventListener('click',()=>switchView(button.dataset.view)));['geoFilter','coverage','priceFilter'].forEach(id=>document.querySelector('#'+id).addEventListener('change',render));document.querySelector('#language').addEventListener('change',event=>{lang=event.target.value;localStorage.setItem('hotel-lang',lang);translate();document.querySelector('#updated').textContent=T[lang].updated+mapUpdatedAt});document.querySelector('#currency').addEventListener('change',event=>{currency=event.target.value;localStorage.setItem('hotel-currency',currency);render()});
