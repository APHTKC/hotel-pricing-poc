<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Taipei luxury hotel public rate and booking curve tracker."><title>Taipei Luxury Hotel Pricing Intelligence</title>
<style>
:root{--ink:#18201c;--muted:#68716b;--paper:#f1eee6;--card:#fffdf8;--line:#ddd6c7;--green:#1d4939;--gold:#af7e35;--red:#8d3d32}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,"Noto Sans TC","Noto Sans JP",system-ui,sans-serif}header{position:relative;background:var(--green);color:#fff;padding:42px max(5vw,24px) 66px}.eyebrow{color:#dbc79d;text-transform:uppercase;letter-spacing:.15em;font-size:12px}h1{font:400 clamp(32px,5vw,58px)/1.1 Georgia,serif;margin:8px 0 12px}.subtitle{max-width:720px;color:#dce7e1}.stamp{margin-top:16px;font-size:12px;color:#b9cec3}.top-controls{position:absolute;right:max(5vw,24px);top:26px;display:flex;gap:8px}.top-controls select{border:1px solid #ffffff55;border-radius:7px;background:#123d2f;color:#fff;padding:8px 10px}main{max-width:1200px;margin:-30px auto 60px;padding:0 24px}.panel{background:var(--card);border:1px solid var(--line);box-shadow:0 8px 24px #20312812;border-radius:12px}.filters{display:grid;grid-template-columns:repeat(5,1fr);gap:16px;padding:18px}.filters label{display:block;color:var(--muted);font-size:12px;margin-bottom:5px}.filters select{width:100%;padding:10px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;overflow:hidden}.metric{padding:24px;border-right:1px solid var(--line)}.metric:last-child{border:0}.label{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em}.value{font:32px Georgia,serif;margin-top:4px}h2{font:400 27px Georgia,serif;margin:32px 0 12px}.table-wrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:980px}th,td{padding:13px 14px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em}.num{text-align:right}.badge{display:inline-block;background:#efe4cb;color:#75531f;padding:2px 7px;border-radius:99px;font-size:11px}.empty{padding:48px 24px;text-align:center;color:var(--muted)}.warning{margin-top:14px;color:var(--red);font-size:13px}@media(max-width:760px){header{padding-top:84px}.top-controls{left:24px;right:auto}.filters,.metrics{grid-template-columns:1fr 1fr}.metric:nth-child(2){border-right:0}.metric{border-bottom:1px solid var(--line)}}
</style></head><body>
<header><div class="top-controls"><select id="language" aria-label="Language"><option value="zh">繁體中文</option><option value="en">English</option><option value="ja">日本語</option></select><select id="currency" aria-label="Currency"><option value="TWD">TWD · NT$</option><option value="USD">USD · $</option><option value="JPY">JPY · ¥</option></select></div><div class="eyebrow">Public rate intelligence · Taipei</div><h1 data-i18n="title">台北高端飯店</h1><div class="subtitle" data-i18n="subtitle">每日追蹤台北高端飯店官方訂房頁的公開房價、房型面積與提前訂房曲線。價格僅供市場觀察，實際訂房條件以官網為準。</div><div class="stamp" id="updated">等待首次資料更新</div></header>
<main><section class="panel filters">
<div><label for="hotel" data-i18n="hotel">飯店</label><select id="hotel"></select></div><div><label for="size" data-i18n="size">房型大小</label><select id="size"><option value="" data-i18n="allSizes">所有大小</option><option>&lt;40㎡</option><option>40–49㎡</option><option>50–69㎡</option><option>70㎡+</option></select></div><div><label for="lead" data-i18n="lead">提前訂房天數</label><select id="lead"><option value="" data-i18n="allLead">所有天數</option><option value="1">+1</option><option value="7">+7</option><option value="14">+14</option><option value="30">+30</option><option value="60">+60</option><option value="90">+90</option></select></div><div><label for="plan" data-i18n="plan">價格方案</label><select id="plan"></select></div><div><label for="snapshot" data-i18n="snapshot">查價批次</label><select id="snapshot"><option value="latest" data-i18n="latest">最新一次</option><option value="all" data-i18n="history">全部歷史</option></select></div>
</section><section class="panel metrics"><div class="metric"><div class="label" data-i18n="adr">中位 ADR</div><div class="value" id="adr">—</div></div><div class="metric"><div class="label" data-i18n="sqmMedian">每㎡中位價</div><div class="value" id="sqm">—</div></div><div class="metric"><div class="label" data-i18n="rateCount">房價筆數</div><div class="value" id="count">—</div></div><div class="metric"><div class="label" data-i18n="roomCount">房型數</div><div class="value" id="rooms">—</div></div></section>
<h2 data-i18n="compare">同期間飯店比較</h2><div class="panel table-wrap"><table><thead><tr><th data-i18n="hotel">飯店</th><th data-i18n="adr">中位 ADR</th><th data-i18n="sqmMedian">每㎡中位價</th><th data-i18n="roomCount">房型數</th><th data-i18n="rateCount">房價筆數</th></tr></thead><tbody id="comparison"><tr><td colspan="5" class="empty">…</td></tr></tbody></table></div>
<h2 data-i18n="details">官網房價明細</h2><div class="panel table-wrap"><table><thead><tr><th data-i18n="hotel">飯店</th><th data-i18n="room">房型</th><th data-i18n="checkin">入住日</th><th>Lead</th><th>Rate plan</th><th data-i18n="breakfast">早餐</th><th data-i18n="beforeTax">未稅價</th><th data-i18n="total">含稅總價</th><th data-i18n="perSqm">每㎡</th></tr></thead><tbody id="rows"><tr><td colspan="9" class="empty">…</td></tr></tbody></table></div><div class="warning" id="notice"></div></main>
<script>
const T={zh:{title:'台北高端飯店',subtitle:'每日追蹤台北高端飯店官方訂房頁的公開房價、房型面積與提前訂房曲線。價格僅供市場觀察，實際訂房條件以官網為準。',hotel:'飯店',size:'房型大小',lead:'提前訂房天數',plan:'價格方案',snapshot:'查價批次',latest:'最新一次',history:'全部歷史',allHotels:'所有飯店',allSizes:'所有大小',allLead:'所有天數',allPlans:'所有方案',adr:'中位 ADR',sqmMedian:'每㎡中位價',rateCount:'房價筆數',roomCount:'房型數',compare:'同期間飯店比較',details:'官網房價明細',room:'房型',checkin:'入住日',breakfast:'早餐',beforeTax:'未稅價',total:'含稅總價',perSqm:'每㎡',yes:'含早餐',no:'不含早餐',unknown:'未標示',noData:'尚無符合條件的資料',updated:'最近查價：',fx:'匯率：Google Finance',loadHistory:'正在載入歷史資料…',error:'資料載入失敗：'},en:{title:'Taipei Luxury Hotels',subtitle:'Daily public-rate tracking from official hotel booking pages, including room size and booking curves. For market observation only; official booking terms prevail.',hotel:'Hotel',size:'Room size',lead:'Lead time',plan:'Rate plan',snapshot:'Snapshot',latest:'Latest',history:'Full history',allHotels:'All hotels',allSizes:'All sizes',allLead:'All lead times',allPlans:'All plans',adr:'Median ADR',sqmMedian:'Median per sqm',rateCount:'Rates',roomCount:'Room types',compare:'Hotel comparison',details:'Official rate details',room:'Room',checkin:'Check-in',breakfast:'Breakfast',beforeTax:'Before tax',total:'Total',perSqm:'Per sqm',yes:'Included',no:'Not included',unknown:'Not stated',noData:'No matching data',updated:'Last checked: ',fx:'FX: Google Finance',loadHistory:'Loading history…',error:'Unable to load data: '},ja:{title:'台北ラグジュアリーホテル',subtitle:'台北の高級ホテル公式予約ページに掲載された公開料金、客室面積、予約リードタイムを毎日追跡します。表示内容は市場調査用です。予約条件は公式サイトをご確認ください。',hotel:'ホテル',size:'客室面積',lead:'予約リードタイム',plan:'料金プラン',snapshot:'取得履歴',latest:'最新',history:'全履歴',allHotels:'すべてのホテル',allSizes:'すべての面積',allLead:'すべての日数',allPlans:'すべてのプラン',adr:'ADR中央値',sqmMedian:'㎡単価中央値',rateCount:'料金件数',roomCount:'客室タイプ数',compare:'同期間ホテル比較',details:'公式料金明細',room:'客室タイプ',checkin:'チェックイン',breakfast:'朝食',beforeTax:'税別料金',total:'税・サービス料込',perSqm:'㎡単価',yes:'朝食付き',no:'朝食なし',unknown:'記載なし',noData:'該当データがありません',updated:'最終取得：',fx:'為替：Google Finance',loadHistory:'履歴を読み込み中…',error:'データを読み込めません：'}};
const locale={zh:'zh-TW',en:'en-US',ja:'ja-JP'};let lang=localStorage.getItem('hotel-lang')||'zh',currency=localStorage.getItem('hotel-currency')||'TWD',fx={TWD:1,USD:.03178,JPY:4.9928},all=[],latestRows=[],fullLoaded=false;
document.querySelector('#language').value=lang;document.querySelector('#currency').value=currency;
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));const median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2};const band=n=>n==null?'unknown':n<40?'<40㎡':n<50?'40–49㎡':n<70?'50–69㎡':'70㎡+';const money=n=>n==null?'—':new Intl.NumberFormat(locale[lang],{style:'currency',currency,maximumFractionDigits:currency==='JPY'?0:0}).format(n*(fx[currency]||1));
function translate(){document.documentElement.lang=lang==='zh'?'zh-Hant':lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T[lang][el.dataset.i18n]);setOptions((document.querySelector('#snapshot').value==='all'?all:latestRows));render()}
function setOptions(rows){const h=document.querySelector('#hotel'),p=document.querySelector('#plan'),hv=h.value,pv=p.value;const hotels=[...new Map(rows.map(r=>[r.hotel_id,r.hotel_name])).entries()].sort((a,b)=>a[1].localeCompare(b[1]));h.innerHTML=`<option value="">${T[lang].allHotels}</option>`+hotels.map(([id,name])=>`<option value="${esc(id)}">${esc(name)}</option>`).join('');const plans=[...new Set(rows.map(r=>r.rate_plan_name).filter(Boolean))].sort();p.innerHTML=`<option value="">${T[lang].allPlans}</option>`+plans.map(name=>`<option value="${esc(name)}">${esc(name)}</option>`).join('');h.value=hv;p.value=pv}
function render(){let rows=document.querySelector('#snapshot').value==='latest'?[...latestRows]:[...all];const hotel=document.querySelector('#hotel').value,size=document.querySelector('#size').value,lead=document.querySelector('#lead').value,plan=document.querySelector('#plan').value;if(hotel)rows=rows.filter(r=>r.hotel_id===hotel);if(size)rows=rows.filter(r=>band(Number(r.room_size_sqm))===size);if(lead)rows=rows.filter(r=>String(r.lead_days)===lead);if(plan)rows=rows.filter(r=>r.rate_plan_name===plan);document.querySelector('#adr').textContent=money(median(rows.map(r=>Number(r.total_twd??r.total_price)).filter(Number.isFinite)));document.querySelector('#sqm').textContent=money(median(rows.map(r=>Number(r.price_per_sqm)).filter(Number.isFinite)));document.querySelector('#count').textContent=rows.length;document.querySelector('#rooms').textContent=new Set(rows.map(r=>r.room_type_code||r.room_type_name)).size;const hotels=[...new Set(rows.map(r=>r.hotel_name))].sort();document.querySelector('#comparison').innerHTML=hotels.length?hotels.map(name=>{const h=rows.filter(r=>r.hotel_name===name);return `<tr><td><strong>${esc(name)}</strong></td><td class="num">${money(median(h.map(r=>Number(r.total_twd??r.total_price)).filter(Number.isFinite)))}</td><td class="num">${money(median(h.map(r=>Number(r.price_per_sqm)).filter(Number.isFinite)))}</td><td class="num">${new Set(h.map(r=>r.room_type_code||r.room_type_name)).size}</td><td class="num">${h.length}</td></tr>`}).join(''):`<tr><td colspan="5" class="empty">${T[lang].noData}</td></tr>`;document.querySelector('#rows').innerHTML=rows.length?rows.slice(0,300).map(r=>`<tr><td><strong>${esc(r.hotel_name)}</strong></td><td>${esc(r.room_type_name)}<br><span class="badge">${esc(r.room_size_sqm??'?')}㎡</span></td><td>${esc(r.check_in)}</td><td>+${esc(r.lead_days)}</td><td>${esc(r.rate_plan_name)}</td><td>${r.breakfast_included===true?T[lang].yes:r.breakfast_included===false?T[lang].no:T[lang].unknown}</td><td class="num">${money(r.price_before_tax==null?null:Number(r.price_before_tax))}</td><td class="num">${money(Number(r.total_price))}</td><td class="num">${money(Number(r.price_per_sqm))}</td></tr>`).join(''):`<tr><td colspan="9" class="empty">${T[lang].noData}</td></tr>`}
const loadJson=path=>fetch(path+'?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()});function acceptLatest(data){latestRows=data.rates||[];all=[...latestRows];if(latestRows.length){const stamps=latestRows.map(r=>r.queried_at).sort(),latest=stamps[stamps.length-1];document.querySelector('#updated').textContent=T[lang].updated+new Date(latest).toLocaleString(locale[lang],{timeZone:'Asia/Taipei'})+' · '+T[lang].fx;setOptions(latestRows)}render()}
Promise.all([loadJson('./data/latest.json').catch(()=>loadJson('./data/rates.json')),loadJson('./data/fx.json').catch(()=>({rates:fx}))]).then(([data,rateData])=>{fx=rateData.rates||fx;translate();acceptLatest(data)}).catch(e=>document.querySelector('#notice').textContent=T[lang].error+e.message);
['hotel','size','lead','plan'].forEach(id=>document.querySelector('#'+id).addEventListener('change',render));document.querySelector('#snapshot').addEventListener('change',function(){if(this.value==='all'&&!fullLoaded){document.querySelector('#notice').textContent=T[lang].loadHistory;loadJson('./data/rates.json').then(d=>{all=d.rates||[];fullLoaded=true;setOptions(all);document.querySelector('#notice').textContent='';render()}).catch(e=>{this.value='latest';document.querySelector('#notice').textContent=T[lang].error+e.message;render()})}else render()});document.querySelector('#language').addEventListener('change',e=>{lang=e.target.value;localStorage.setItem('hotel-lang',lang);translate();if(latestRows.length)acceptLatest({rates:latestRows})});document.querySelector('#currency').addEventListener('change',e=>{currency=e.target.value;localStorage.setItem('hotel-currency',currency);render()});
</script></body></html>
