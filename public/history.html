<title>Historical Analysis · Taiwan Luxury Hotels</title>
<style>
:root{--ink:#222;--muted:#5b5b58;--paper:#f5f4f0;--card:#fff;--line:#e2e2dc;--blue:#005689;--red:#a6192e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 Inter,"Noto Sans TC","Noto Sans JP",system-ui,sans-serif}header{background:#fafafa;border-bottom:4px double #111;padding:18px max(5vw,24px) 26px}.header-top{display:flex;align-items:center;justify-content:space-between;gap:20px}.eyebrow{color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}.top-controls{display:flex;align-items:center;gap:8px;flex-shrink:0}.top-controls a,.top-controls select{border:1px solid #888;border-radius:0;background:#fff;color:#222;padding:8px 10px;font:inherit}.top-controls a{font-weight:700;text-decoration:none}h1{font:400 clamp(30px,4vw,48px)/1.05 Georgia,"Times New Roman",serif;margin:12px 0 7px}.subtitle{max-width:800px;color:#444;font-family:Georgia,"Times New Roman","Noto Serif TC",serif}.stamp{margin-top:10px;color:#666;font-size:12px}main{max-width:1200px;margin:24px auto 60px;padding:0 24px}.panel{background:var(--card);border:1px solid var(--line)}.filters{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;padding:18px;border-top:2px solid #111;border-bottom:1px solid #111}.filters label{display:block;margin-bottom:5px;color:var(--muted);font-size:12px}.filters select{width:100%;padding:10px;border:1px solid #999;background:#fff;color:var(--ink)}.metrics{display:grid;grid-template-columns:repeat(4,1fr);margin-top:18px;border-bottom:2px solid #111}.metric{padding:20px 24px;border-right:1px solid var(--line)}.metric:last-child{border:0}.label{color:var(--muted);font-size:11px;letter-spacing:.08em;text-transform:uppercase}.value{margin-top:4px;font:30px Georgia,"Times New Roman",serif}h2{margin:30px 0 12px;font:400 25px Georgia,"Times New Roman",serif}.chart-panel{padding:18px 18px 10px;border-top:2px solid #111;border-bottom:1px solid #111}.chart-subtitle{margin:-6px 0 12px;color:var(--muted);font-size:12px}.chart-wrap{width:100%;min-height:350px;overflow:hidden}.chart-wrap svg{display:block;width:100%;height:auto}.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin:10px 2px 4px;color:var(--muted);font-size:12px}.legend-item{display:flex;align-items:center;gap:6px}.legend-dot{width:9px;height:9px;border-radius:50%}.empty{padding:48px 24px;text-align:center;color:var(--muted)}.notice{margin-top:14px;color:var(--red);font-size:13px}.source-note{margin-top:28px;padding-top:10px;border-top:1px solid #999;color:var(--muted);font-size:11px}html[lang="ja"] body,html[lang="ja"] h1,html[lang="ja"] h2,html[lang="ja"] .value{font-family:"Noto Sans JP","Yu Gothic",Meiryo,sans-serif}html[lang="ja"] h1,html[lang="ja"] h2{font-weight:500}@media(max-width:760px){header{padding:16px 18px 24px}.header-top{align-items:flex-start;flex-direction:column-reverse;gap:12px}.top-controls{width:100%;flex-wrap:wrap}.top-controls select{flex:1;min-width:0}main{padding:0 12px;margin-top:16px}.filters{grid-template-columns:1fr 1fr;gap:12px}.metrics{grid-template-columns:1fr 1fr}.metric{padding:16px;border-bottom:1px solid var(--line)}.metric:nth-child(2){border-right:0}.value{font-size:25px}.chart-panel{padding:12px 8px 8px}.chart-wrap{min-height:250px}}
.legend-item.interactive{border:0;background:transparent;color:inherit;padding:2px 0;font:inherit;cursor:pointer}.legend-item.interactive:hover,.legend-item.interactive:focus{color:var(--ink);text-decoration:underline}.legend-item.interactive.is-hidden{opacity:.42;text-decoration:line-through}.legend-item.interactive .legend-dot{flex:0 0 auto}

<body>
<header>
  <div class="header-top"><div class="eyebrow" data-i18n="brand">Public rate intelligence · Taiwan</div><div class="top-controls"><a href="./" data-i18n="home">回到首頁</a><select id="language" aria-label="Language"><option value="zh">繁體中文</option><option value="en">English</option><option value="ja">日本語</option></select><select id="currency" aria-label="Currency"><option value="TWD">TWD · NT$</option><option value="USD">USD · $</option><option value="JPY">JPY · ¥</option></select></div></div>
  <h1 data-i18n="title">歷史房價分析</h1><div class="subtitle" data-i18n="subtitle">比較每日查價紀錄與不同提前訂房天數的市場變化。篩選條件會同時套用於兩張圖表。</div><div class="stamp" id="updated">…</div>
</header>
<main>
  <section class="panel filters"><div><label for="city" data-i18n="city">城市</label><select id="city"></select></div><div><label for="hotel" data-i18n="hotel">飯店</label><select id="hotel"></select></div><div><label for="size" data-i18n="size">房型大小</label><select id="size"><option value="" data-i18n="allSizes">所有大小</option><option>&lt;40㎡</option><option>40–49㎡</option><option>50–69㎡</option><option>70㎡+</option></select></div><div><label for="lead" data-i18n="lead">提前訂房天數</label><select id="lead"><option value="" data-i18n="allLead">所有天數</option><option value="1">+1</option><option value="7">+7</option><option value="14">+14</option><option value="30">+30</option><option value="60">+60</option><option value="90">+90</option></select></div></section>
  <section class="panel metrics"><div class="metric"><div class="label" data-i18n="median">歷史中位 ADR</div><div class="value" id="median">—</div></div><div class="metric"><div class="label" data-i18n="observations">歷史房價筆數</div><div class="value" id="observations">—</div></div><div class="metric"><div class="label" data-i18n="hotels">飯店數</div><div class="value" id="hotels">—</div></div><div class="metric"><div class="label" data-i18n="days">查價日數</div><div class="value" id="days">—</div></div></section>

  <h2 data-i18n="curveTitle">提前訂房曲線</h2><section class="panel chart-panel"><div class="chart-subtitle" data-i18n="curveHint">比較入住前 1、7、14、30、60、90 天的含稅房價中位數</div><div id="curveChart" class="chart-wrap"><div class="empty">…</div></div><div id="curveLegend" class="legend"></div></section>
  <div class="notice" id="notice"></div><footer class="source-note" data-i18n="source">資料來源：各飯店官方公開訂房頁；匯率採 Google Finance。圖表為歷史公開價格中位數，不代表未來售價。</footer>
</main>
<script>
const T={zh:{brand:'Public rate intelligence · Taiwan',home:'回到首頁',title:'歷史房價分析',subtitle:'比較每日查價紀錄與不同提前訂房天數的市場變化。篩選條件會同時套用於兩張圖表。',city:'城市',hotel:'飯店',size:'房型大小',lead:'提前訂房天數',allCities:'所有城市',allHotels:'所有飯店',allSizes:'所有大小',allLead:'所有天數',median:'歷史中位 ADR',observations:'歷史房價筆數',hotels:'飯店數',days:'查價日數',dailyTitle:'每日市場中位房價趨勢',dailyHint:'依實際查價日彙整各飯店的含稅房價中位數',curveTitle:'提前訂房曲線',curveHint:'比較入住前 1、7、14、30、60、90 天的含稅房價中位數',updated:'資料期間：',noData:'尚無符合條件的歷史資料',error:'歷史資料載入失敗：',source:'資料來源：各飯店官方公開訂房頁；匯率採 Google Finance。圖表為歷史公開價格中位數，不代表未來售價。'},en:{brand:'Public rate intelligence · Taiwan',home:'Back to overview',title:'Historical Rate Analysis',subtitle:'Compare daily rate observations and booking lead-time patterns. Filters apply to both charts.',city:'City',hotel:'Hotel',size:'Room size',lead:'Lead time',allCities:'All cities',allHotels:'All hotels',allSizes:'All sizes',allLead:'All lead times',median:'Historical median ADR',observations:'Historical rates',hotels:'Hotels',days:'Observation days',dailyTitle:'Daily median rate history',dailyHint:'Median tax-inclusive public rate for each hotel by observation date',curveTitle:'Booking curve',curveHint:'Median tax-inclusive rate at 1, 7, 14, 30, 60, and 90 days before arrival',updated:'Data period: ',noData:'No matching historical data',error:'Unable to load history: ',source:'Sources: official public hotel booking pages; foreign exchange rates from Google Finance. Charts show historical public-rate medians and do not predict future prices.'},ja:{brand:'Public rate intelligence · Taiwan',home:'概要に戻る',title:'料金履歴分析',subtitle:'日々の料金取得結果と予約リードタイム別の変化を比較します。フィルターは両方のグラフに適用されます。',city:'都市',hotel:'ホテル',size:'客室面積',lead:'予約リードタイム',allCities:'すべての都市',allHotels:'すべてのホテル',allSizes:'すべての面積',allLead:'すべての日数',median:'過去ADR中央値',observations:'料金件数',hotels:'ホテル数',days:'取得日数',dailyTitle:'日別料金中央値の推移',dailyHint:'取得日ごとにホテル別の税・サービス料込公開料金中央値を集計',curveTitle:'予約リードタイム曲線',curveHint:'宿泊日の1、7、14、30、60、90日前における料金中央値',updated:'データ期間：',noData:'該当 const HOTEL_NAMES_ZH={capella_taipei:'台北嘉佩樂酒店',grand_hilai_taipei:'台北漢來大飯店',grand_mayfull_taipei:'台北美福大飯店',royal_nikko_taipei:'台北老爺酒店',mo_taipei:'台北文華東方酒店',shangrila_taipei:'台北遠東香格里拉',okura_prestige_taipei:'大倉久和大飯店',palais_de_chine:'君品酒店',hoshinoya_guguan:'虹夕諾雅 谷關',sheraton_hsinchu:'新竹豐邑喜來登大飯店',intercontinental_taichung:'台中勤美洲際酒店',hotel_nikko_kaohsiung:'高雄日航酒店',intercontinental_kaohsiung:'高雄洲際酒店',kaohsiung_marriott:'高雄萬豪酒店'};
const CITY_NAMES={zh:{Taipei:'台北',Taichung:'台中',Kaohsiung:'高雄',Hsinchu:'新竹',Tainan:'台南','New Taipei':'新北',NewTaipei:'新北',Hualien:'花蓮',Yilan:'宜蘭',Nantou:'南投',Taitung:'台東',Penghu:'澎湖'},ja:{Taipei:'台北',Taichung:'台中',Kaohsiung:'高雄',Hsinchu:'新竹',Tainan:'台南','New Taipei':'新北',NewTaipei:'新北',Hualien:'花蓮',Yilan:'宜蘭',Nantou:'南投',Taitung:'台東',Penghu:'澎湖'}};
const locale={zh:'zh-TW',en:'en-US',ja:'ja-JP'},colors=['#005689','#a6192e','#555','#6b5aa6','#8a693e','#00857c','#b05b24','#3974a5','#853b65'];let lang=localStorage.getItem('hotel-lang')||'zh',currency=localStorage.getItem('hotel-currency')||'TWD',fx={TWD:1,USD:.03178,JPY:4.9928},allRows=[];
const cityName=name=>(CITY_NAMES[lang]&&CITY_NAMES[lang][name])||name;
const hiddenHistorySeries={daily:new Set(),curve:new Set()};
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])),hotelName=(id,name)=>lang==='zh'?(HOTEL_NAMES_ZH[id]||name):name,median=a=>{if(!a.length)return null;const s=[...a].sort((x,y)=>x-y),m=Math.floor(s.length/2);return s.length%2?s[m]:(s[m-1]+s[m])/2},band=n=>!Number.isFinite(n)?'unknown':n<40?'<40㎡':n<50?'40–49㎡':n<70?'50–69㎡':'70㎡+',valueOf=r=>Number(r.total_twd??r.total_price),dayOf=r=>String(r.queried_at||'').slice(0,10),money=n=>n==null?'—':new Intl.NumberFormat(locale[lang],{style:'currency',currency,maximumFractionDigits:0}).format(n*(fx[currency]||1));
function setOptions(){const city=document.querySelector('#city'),hotel=document.querySelector('#hotel'),cv=city.value,hv=hotel.value,cities=[...new Set(allRows.map(r=>r.city).filter(Boolean))].sort(),hotels=[...new Map(allRows.map(r=>[r.hotel_id,r.hotel_name])).entries()].sort((a,b)=>hotelName(a[0],a[1]).localeCompare(hotelName(b[0],b[1]),locale[lang]));city.innerHTML=`<option value="">${T[lang].allCities}</option>`+cities.map(v=>`<option value="${esc(v)}">${esc(cityName(v))}</option>`).join('');hotel.innerHTML=`<option value="">${T[lang].allHotels}</option>`+hotels.map(([id,name])=>`<option value="${esc(id)}">${esc(hotelName(id,name))}</option>`).join('');city.value=cv;hotel.value=hv}
function lineChart(rootId,legendId,xValues,series,xLabel,title){const root=document.querySelector(rootId),legend=document.querySelector(legendId),values=series.flatMap(s=>s.points).filter(Number.isFinite);if(!xValues.length||!values.length){root.innerHTML=`<div class="empty">${T[lang].noData}</div>`;legend.innerHTML='';return}const W=1000,H=350,L=86,R=24,TP=22,B=54,min=Math.min(...values),max=Math.max(...values),yMin=Math.max(0,min*.82),yMax=max*1.08||1,x=i=>xValues.length===1?(L+W-R)/2:L+i*(W-L-R)/(xValues.length-1),y=v=>TP+(yMax-v)*(H-TP-B)/(yMax-yMin||1),compact=v=>new Intl.NumberFormat(locale[lang],{style:'currency',currency,notation:'compact',maximumFractionDigits:1}).format(v),step=Math.max(1,Math.ceil(xValues.length/7));let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">`;for(let i=0;i<5;i++){const v=yMin+(yMax-yMin)*i/4,py=y(v);svg+=`<line x1="${L}" y1="${py}" x2="${W-R}" y2="${py}" stroke="#e2e2dc"/><text x="${L-10}" y="${py+4}" text-anchor="end" fill="#555" font-size="12">${esc(compact(v))}</text>`}xValues.forEach((v,i)=>{if(i%step===0||i===xValues.length-1)svg+=`<text x="${x(i)}" y="${H-22}" text-anchor="middle" fill="#555" font-size="12">${esc(xLabel(v))}</text>`});series.forEach(s=>{let segment=[];const flush=()=>{if(segment.length){svg+=`<polyline points="${segment.map(p=>`${x(p.i)},${y(p.v)}`).join(' ')}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;segment=[]}};s.points.forEach((v,i)=>{if(Number.isFinite(v)){segment.push({v,i});svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.color}" stroke="#fff" stroke-width="1.5"><title>${esc(s.name)} · ${esc(xLabel(xValues[i]))} · ${esc(new Intl.NumberFormat(locale[lang],{style:'currency',currency,maximumFractionDigits:0}).format(v))}</title></circle>`}else flush()});flush()});root.innerHTML=svg+'</svg>';legend.innerHTML=series.filter(s=>s.points.some(Number.isFinite)).map(s=>`<span class="legend-item"><span class="legend-dot" s function toggleHistorySeries(chartKey,name){const hidden=hiddenHistorySeries[chartKey];hidden.has(name)?hidden.delete(name):hidden.add(name);render()}
function lineChart(rootId,legendId,xValues,series,xLabel,title){const chartKey=rootId==='#dailyChart'?'daily':'curve',root=document.querySelector(rootId),legend=document.querySelector(legendId),available=series.filter(s=>s.points.some(Number.isFinite)),visible=available.filter(s=>!hiddenHistorySeries[chartKey].has(s.name)),values=visible.flatMap(s=>s.points).filter(Number.isFinite);legend.innerHTML=available.map(s=>`<button type="button" class="legend-item interactive${hiddenHistorySeries[chartKey].has(s.name)?' is-hidden':''}" aria-pressed="${!hiddenHistorySeries[chartKey].has(s.name)}" onclick="toggleHistorySeries('${chartKey}','${esc(s.name)}')"><span class="legend-dot" style="background:${s.color}"></span>${esc(s.name)}</button>`).join('');if(!xValues.length||!values.length){root.innerHTML=`<div class="empty">${T[lang].noData}</div>`;return}const W=1000,H=350,L=86,R=24,TP=22,B=54,min=Math.min(...values),max=Math.max(...values),yMin=Math.max(0,min*.82),yMax=max*1.08||1,x=i=>xValues.length===1?(L+W-R)/2:L+i*(W-L-R)/(xValues.length-1),y=v=>TP+(yMax-v)*(H-TP-B)/(yMax-yMin||1),compact=v=>new Intl.NumberFormat(locale[lang],{style:'currency',currency,notation:'compact',maximumFractionDigits:1}).format(v),step=Math.max(1,Math.ceil(xValues.length/7));let svg=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">`;for(let i=0;i<5;i++){const v=yMin+(yMax-yMin)*i/4,py=y(v);svg+=`<line x1="${L}" y1="${py}" x2="${W-R}" y2="${py}" stroke="#e2e2dc"/><text x="${L-10}" y="${py+4}" text-anchor="end" fill="#555" font-size="12">${esc(compact(v))}</text>`}xValues.forEach((v,i)=>{if(i%step===0||i===xValues.length-1)svg+=`<text x="${x(i)}" y="${H-22}" text-anchor="middle" fill="#555" font-size="12">${esc(xLabel(v))}</text>`});visible.forEach(s=>{let segment=[];const flush=()=>{if(segment.length){svg+=`<polyline points="${segment.map(p=>`${x(p.i)},${y(p.v)}`).join(' ')}" fill="none" stroke="${s.color}" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`;segment=[]}};s.points.forEach((v,i)=>{if(Number.isFinite(v)){segment.push({v,i});svg+=`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="${s.color}" stroke="#fff" stroke-width="1.5"><title>${esc(s.name)} · ${esc(xLabel(xValues[i]))} · ${esc(new Intl.NumberFormat(locale[lang],{style:'currency',currency,maximumFractionDigits:0}).format(v))}</title></circle>`}else flush()});flush()});root.innerHTML=svg+'</svg>'}
function render(){let rows=[...allRows],city=document.querySelector('#city').value,hotel=document.querySelector('#hotel').value,size=document.querySelector('#size').value,lead=document.querySelector('#lead').value;if(city)rows=rows.filter(r=>r.city===city);if(hotel)rows=rows.filter(r=>r.hotel_id===hotel);if(size)rows=rows.filter(r=>band(Number(r.room_size_sqm))===size);if(lead)rows=rows.filter(r=>String(r.lead_days)===lead);const valid=rows.filter(r=>Number.isFinite(valueOf(r))),days=[...new Set(valid.map(dayOf).filter(Boolean))].sort(),hotels=[...new Map(valid.map(r=>[r.hotel_id,r.hotel_name])).entries()].sort((a,b)=>hotelName(a[0],a[1]).localeCompare(hotelName(b[0],b[1]),locale[lang]));document.querySelector('#median').textContent=money(median(valid.map(valueOf)));document.querySelector('#observations').textContent=valid.length.toLocaleString(locale[lang]);document.querySelector('#hotels').textContent=hotels.length;document.querySelector('#days').textContent=days.length;const daily=hotels.map(([id,name],i)=>({name:hotelName(id,name),color:colors[i%colors.length],points:days.map(day=>{const v=valid.filter(r=>r.hotel_id===id&&dayOf(r)===day).map(valueOf);const m=median(v);return m==null?null:m*(fx[currency]||1)})}));lineChart('#dailyChart','#dailyLegend',days,daily,d=>new Intl.DateTimeFormat(locale[lang],{month:'numeric',day:'numeric'}).format(new Date(d+'T00:00:00')),T[lang].dailyTitle);const leads=[...new Set(valid.map(r=>Number(r.lead_days)).filter(Number.isFinite))].sort((a,b)=>a-b),curve=hotels.map(([id,name],i)=>({name:hotelName(id,name),color:colors[i%colors.length],points:leads.map(l=>{const v=valid.filter(r=>r.hotel_id===id&&Number(r.lead_days)===l).map(valueOf);const m=median(v);return m==null?null:m*(fx[currency]||1)})}));lineChart('#curveChart','#curveLegend',leads,curve,l=>`+${l}`,T[lang].curveTitle)}
function translate(){document.documentElement.lang=lang==='zh'?'zh-Hant':lang;document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=T[lang][el.dataset.i18n]);setOptions();if(allRows.length){const days=[...new Set(allRows.map(dayOf).filter(Boolean))].sort();document.querySelector('#updated').textContent=T[lang].updated+(days.length?`${days[0]} — ${days[days.length-1]}`:'—')}render()}
document.querySelector('#language').value=lang;document.querySelector('#currency').value=currency;['city','hotel','size','lead'].forEach(id=>document.querySelector('#'+id).addEventListener('change',render));document.querySelector('#language').addEventListener('change',e=>{lang=e.target.value;localStorage.setItem('hotel-lang',lang);translate()});document.querySelector('#currency').addEventListener('change',e=>{currency=e.target.value;localStorage.setItem('hotel-currency',currency);render()});const loadJson=p=>fetch(p+'?v='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()});Promise.all([loadJson('./data/rates.json'),loadJson('./data/fx.json').catch(()=>({rates:fx}))]).then(([data,rateData])=>{allRows=data.rates||[];fx=rateData.rates||fx;translate()}).catch(e=>document.querySelector('#notice').textContent=T[lang].error+e.message);
