<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>匯出資料字典 · 台灣飯店房價查詢平台</title>
<style>
:root{--ink:#171717;--muted:#666;--line:#aaa;--paper:#f7f6f2;--blue:#005689;--red:#a6192e}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Inter,"Noto Sans TC","Noto Sans JP",Arial,sans-serif}header,main,footer{max-width:1120px;margin:auto;padding:24px}header{padding-top:34px;border-bottom:4px solid var(--ink)}.eyebrow{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}h1{margin:8px 0;font:800 clamp(28px,5vw,52px)/1.05 Georgia,"Noto Serif TC",serif}.lede{max-width:820px;color:var(--muted);line-height:1.65}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:18px}.links,.languages{display:flex;flex-wrap:wrap;gap:8px}.links a,.languages button{border:1px solid var(--ink);background:#fff;color:var(--ink);padding:8px 11px;font:700 12px/1.2 inherit;text-decoration:none;cursor:pointer}.languages button[aria-pressed="true"]{background:var(--ink);color:#fff}.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:0 0 20px}.summary div,.panel{background:#fff;border:1px solid var(--line);border-top:3px solid var(--ink)}.summary div{padding:14px}.summary b,.summary span{display:block}.summary b{font-size:20px}.summary span{margin-top:3px;color:var(--muted);font-size:11px}.panel{margin:14px 0;padding:18px}.panel h2{margin:0 0 12px;font-size:19px}.panel p{line-height:1.6}.scope-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.scope{min-width:0;padding:12px;border-left:3px solid var(--blue);background:#f0f4f6}.scope code,.field-list code{overflow-wrap:anywhere}.scope strong,.scope small{display:block}.scope small{margin-top:5px;color:var(--muted);line-height:1.45}.rules{margin:0;padding-left:20px;line-height:1.7}.field-group{padding:12px 0;border-top:1px solid #ddd}.field-group:first-child{border-top:0}.field-group h3{margin:0 0 4px;font-size:14px}.field-group p{margin:0 0 8px;color:var(--muted);font-size:12px}.field-list{display:flex;flex-wrap:wrap;gap:5px}.field-list code{padding:4px 6px;background:#eef1f2;border:1px solid #d5dadd;font-size:11px}.note{padding:11px;border-left:3px solid var(--red);background:#fff1ec;font-size:12px;line-height:1.6}footer{color:var(--muted);font-size:11px}@media(max-width:720px){header,main,footer{padding:18px}.toolbar{align-items:stretch;flex-direction:column}.summary,.scope-grid{grid-template-columns:1fr}.links a,.languages button{flex:1;text-align:center}}@media print{.toolbar{display:none}body{background:#fff}.panel{break-inside:avoid}}
.field-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px}.field-card{min-width:0;padding:7px;background:#eef1f2;border:1px solid #d5dadd}.field-card code,.field-card small{display:block;overflow-wrap:anywhere}.field-card small{margin-top:4px;color:var(--muted);font-size:10px;line-height:1.4}@media(max-width:720px){.field-list{grid-template-columns:1fr}}
.column-order-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.column-order-card{min-width:0;padding:12px;background:#f5f7f8;border-left:3px solid var(--blue)}.column-order-head{display:flex;align-items:center;justify-content:space-between;gap:10px}.column-order-head h3{margin:0;font-size:14px}.copy-columns{border:1px solid var(--blue);background:#fff;color:var(--blue);padding:6px 9px;font:700 11px/1.2 inherit;cursor:pointer}.copy-columns:hover,.copy-columns:focus{background:var(--blue);color:#fff}.column-order{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 18px;margin:10px 0 0;padding-left:28px}.column-order li{min-width:0;padding:2px 0;color:var(--muted);font-size:10px}.column-order code{color:var(--ink);overflow-wrap:anywhere}.copy-status{min-height:1.5em;margin:9px 0 0;color:var(--blue);font-size:11px;font-weight:700}@media(max-width:720px){.column-order-grid,.column-order{grid-template-columns:1fr}.column-order-head{align-items:stretch;flex-direction:column}.copy-columns{width:100%}}@media print{.copy-columns,.copy-status{display:none}.column-order{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
<link rel="stylesheet" href="./assets/css/shell.css">
</head>
<body>
<header>
  <div class="eyebrow" id="eyebrow">Export contract · schema 1.1</div>
  <h1 id="title">匯出資料字典</h1>
  <p class="lede" id="lede"></p>
  <div class="toolbar">
    <nav class="links" aria-label="Dashboard"><a href="./index.html" id="latestLink">最新房價</a><a href="./history.html" id="historyLink">歷史分析</a><a href="./export-schema.json" id="schemaJson" download>下載 schema JSON</a></nav>
    <div class="languages" aria-label="Language"><button type="button" data-lang="zh" aria-pressed="true">繁體中文</button><button type="button" data-lang="en" aria-pressed="false">English</button><button type="button" data-lang="ja" aria-pressed="false">日本語</button></div>
  </div>
</header>
<main>
  <section class="summary" id="summary"></section>
  <section class="panel"><h2 id="scopeTitle"></h2><div class="scope-grid" id="scopes"></div></section>
  <section class="panel"><h2 id="valueTitle"></h2><ul class="rules" id="rules"></ul><p class="note" id="strictNote"></p></section>
  <section class="panel"><h2 id="columnOrderTitle"></h2><div class="column-order-grid"><section class="column-order-card"><div class="column-order-head"><h3 id="latestColumnsTitle"></h3><button class="copy-columns" type="button" data-copy-columns="latest" aria-controls="latestColumns" aria-describedby="copyStatus"></button></div><ol class="column-order" id="latestColumns"></ol></section><section class="column-order-card"><div class="column-order-head"><h3 id="historyColumnsTitle"></h3><button class="copy-columns" type="button" data-copy-columns="history" aria-controls="historyColumns" aria-describedby="copyStatus"></button></div><ol class="column-order" id="historyColumns"></ol></section></div><p class="copy-status" id="copyStatus" role="status" aria-live="polite"></p></section>
  <section class="panel"><h2 id="fieldTitle"></h2><div id="fields"></div></section>
</main>
<footer id="footer"></footer>
<script>
let schema=null;
const copy={
zh:{title:'匯出資料字典',lede:'最新頁與歷史頁共用此一 schema 1.1 說明。它定義匯出範圍、缺值語意、strict 比較欄位與來源證據，避免把篩選結果誤認為完整倉庫。',latest:'最新房價',history:'歷史分析',summary:['Schema 版本','支援格式','欄位群組'],scopeTitle:'資料範圍',scope:{latest_filtered_rows:'最新批次中符合目前篩選條件的明細列；不是完整歷史倉庫。',selected_month_hotel_details:'所選月份、飯店與目前篩選條件的明細列。',weekly_digest:'全歷史預先彙總週報，不受目前明細篩選影響。',warehouse_all_history:'全歷史倉庫品質快照，不是 rates 明細。'},valueTitle:'值與缺值規則',rules:['JSON 的 null 與 CSV 的空白儲存格皆表示來源沒有可驗證值。','字串 unknown 是明確的「未知」分類，不等於 false、零或未提供。','布林 true／false 保持機器可分析格式；數值欄位不加幣別符號。','display_* 欄位依使用者選取幣別換算；TWD 正規化欄位不受畫面幣別影響。','CSV 文字若以 =、+、-、@ 開頭會加前置單引號，避免試算表公式注入。'],strictNote:'strict_parity_eligible 只有在飯店、日期、入住人數、房型、早餐、取消、稅費與 24 小時查價窗皆可比時才為 true；不得用其他商品或來源補值。',fieldTitle:'明細欄位',groups:{identity:['識別與查價批次','飯店、地理位置、查價時間與 run_id。'],stay:['入住條件','入住日期、晚數、提前天數與人數。'],room:['房型','來源房型代碼、穩定 ID、名稱與單一房型面積。'],terms:['商品條款','方案、早餐、稅費與取消條款；沒有證據時維持 null／unknown。'],strict:['Strict 比較','比較狀態、完整 canonical key 與 eligibility。'],price:['價格與幣別','來源價格拆項、TWD 正規化值與畫面幣別換算值。'],source:['來源證據','平台、擷取方法、來源 property ID 與 HTTPS URL。']},footer:'JSONL 是權威來源；Parquet 僅為可重建的正規化分析鏡像。'},
en:{title:'Export data dictionary',lede:'The latest and history pages share this schema 1.1 reference. It defines export scopes, missing-value semantics, strict-comparison fields, and source evidence so filtered rows are not mistaken for the full warehouse.',latest:'Latest rates',history:'History analysis',summary:['Schema version','Formats','Field groups'],scopeTitle:'Data scopes',scope:{latest_filtered_rows:'Rows from the latest batch after current filters; not the full historical warehouse.',selected_month_hotel_details:'Detail rows for the selected month and hotel after current filters.',weekly_digest:'Preaggregated digest for all history; unaffected by detail filters.',warehouse_all_history:'Quality snapshot for the full historical warehouse; not rate details.'},valueTitle:'Value and missing-data rules',rules:['JSON null and an empty CSV cell mean the source has no verifiable value.','The string unknown is an explicit unknown category; it is not false, zero, or omitted.','Boolean true/false and finite numbers remain machine-readable; numeric fields omit currency symbols.','display_* fields use the selected display currency; normalized TWD fields do not change with the UI currency.','CSV text beginning with =, +, -, or @ receives a leading apostrophe to prevent spreadsheet formula injection.'],strictNote:'strict_parity_eligible is true only when hotel, dates, occupancy, room, breakfast, cancellation, tax treatment, and the 24-hour query window are comparable. Values are never borrowed from another product or source.',fieldTitle:'Detail fields',groups:{identity:['Identity and query batch','Hotel, geography, query time, and run_id.'],stay:['Stay criteria','Stay dates, nights, lead time, and occupancy.'],room:['Room','Source room code, stable ID, names, and single-room area.'],terms:['Product terms','Rate plan, breakfast, tax, and cancellation; null/unknown without evidence.'],strict:['Strict comparison','Comparison status, complete canonical key, and eligibility.'],price:['Price and currency','Source price components, normalized TWD values, and display-currency values.'],source:['Source evidence','Platform, collection method, property ID, and HTTPS URL.']},footer:'JSONL is authoritative; Parquet is a rebuildable normalized analytics mirror.'},
ja:{title:'出力データ辞書',lede:'最新ページと履歴ページで共通の schema 1.1 リファレンスです。出力範囲、欠損値、strict 比較項目、出典証拠を定義し、絞り込み結果と全履歴ウェアハウスの混同を防ぎます。',latest:'最新料金',history:'履歴分析',summary:['Schema バージョン','対応形式','項目グループ'],scopeTitle:'データ範囲',scope:{latest_filtered_rows:'最新バッチに現在の絞り込みを適用した明細行。全履歴ウェアハウスではありません。',selected_month_hotel_details:'選択した月・ホテルに現在の絞り込みを適用した明細行。',weekly_digest:'全履歴の事前集計済み週次ダイジェスト。明細絞り込みの対象外です。',warehouse_all_history:'全履歴ウェアハウスの品質スナップショット。料金明細ではありません。'},valueTitle:'値と欠損のルール',rules:['JSON の null と CSV の空セルは、検証可能な値が出典にないことを示します。','文字列 unknown は明示的な不明区分で、false、ゼロ、省略とは異なります。','真偽値 true／false と有限数値は分析可能な形式を維持し、数値欄に通貨記号は付けません。','display_* は選択通貨による換算値です。TWD 正規化項目は画面通貨の影響を受けません。','=、+、-、@ で始まる CSV 文字列には、数式注入防止のため先頭にアポストロフィを付けます。'],strictNote:'strict_parity_eligible は、ホテル、日付、人数、客室、朝食、キャンセル、税、24時間以内の検索がすべて比較可能な場合のみ true です。別商品・別ソースから値を補完しません。',fieldTitle:'明細項目',groups:{identity:['識別・検索バッチ','ホテル、地域、検索時刻、run_id。'],stay:['宿泊条件','宿泊日、泊数、リードタイム、人数。'],room:['客室','ソース客室コード、安定 ID、名称、1室あたり面積。'],terms:['商品条件','プラン、朝食、税、キャンセル。証拠がなければ null／unknown。'],strict:['Strict 比較','比較状態、完全な canonical key、eligibility。'],price:['料金・通貨','ソース料金内訳、TWD 正規化値、表示通貨換算値。'],source:['出典証拠','プラットフォーム、収集方法、property ID、HTTPS URL。']},footer:'JSONL が正本で、Parquet は再構築可能な正規化分析ミラーです。'}
};
const metaCopy={zh:{nullable:'可為空值',required:'不可為空值',unknown:'可使用 unknown',latest:'最新 CSV',history:'歷史 CSV',json:'僅 JSON'},en:{nullable:'nullable',required:'non-null',unknown:'unknown allowed',latest:'latest CSV',history:'history CSV',json:'JSON only'},ja:{nullable:'null 可',required:'null 不可',unknown:'unknown 可',latest:'最新 CSV',history:'履歴 CSV',json:'JSON のみ'}};
const columnCopy={zh:{title:'CSV 欄位順序',latest:'最新資料 CSV · 38 欄',history:'歷史明細 CSV · 46 欄',latestKind:'最新 CSV',historyKind:'歷史 CSV',copy:'複製欄名',success:'已複製 {kind} 欄名',failure:'無法複製欄名，請直接下載 schema JSON'},en:{title:'CSV column order',latest:'Latest CSV · 38 columns',history:'History details CSV · 46 columns',latestKind:'latest CSV',historyKind:'history CSV',copy:'Copy names',success:'Copied {kind} column names',failure:'Could not copy column names; download the schema JSON instead'},ja:{title:'CSV 項目順序',latest:'最新 CSV · 38項目',history:'履歴明細 CSV · 46項目',latestKind:'最新 CSV',historyKind:'履歴 CSV',copy:'項目名をコピー',success:'{kind} の項目名をコピーしました',failure:'項目名をコピーできません。schema JSON をダウンロードしてください'}};
let lang=localStorage.getItem('hotel-lang')||'zh';
function esc(value){return String(value).replace(/[&<>"']/g,char=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]))}
function fieldMeta(field){const labels=metaCopy[lang],definition=schema.field_definitions[field]||{},outputs=[];if(schema.csv_columns.latest.includes(field))outputs.push(labels.latest);if(schema.csv_columns.history.includes(field))outputs.push(labels.history);if(!outputs.length)outputs.push(labels.json);return[definition.type||'string',definition.nullable?labels.nullable:labels.required,...outputs,definition.unknown_allowed?labels.unknown:null].filter(Boolean).join(' · ')}
function renderColumnOrder(){const labels=columnCopy[lang];document.querySelector('#columnOrderTitle').textContent=labels.title;document.querySelector('#latestColumnsTitle').textContent=labels.latest;document.querySelector('#historyColumnsTitle').textContent=labels.history;document.querySelectorAll('[data-copy-columns]').forEach(button=>button.textContent=labels.copy);for(const kind of['latest','history'])document.querySelector(`#${kind}Columns`).innerHTML=schema.csv_columns[kind].map(field=>`<li><code>${esc(field)}</code></li>`).join('')}
function legacyCopy(text){const area=document.createElement('textarea');area.value=text;area.setAttribute('readonly','');area.style.cssText='position:fixed;left:-9999px';document.body.append(area);area.select();const copied=document.execCommand('copy');area.remove();if(!copied)throw new Error('copy failed')}
async function copyColumns(kind){const labels=columnCopy[lang],text=schema.csv_columns[kind].join(',');try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else legacyCopy(text);document.querySelector('#copyStatus').textContent=labels.success.replace('{kind}',labels[`${kind}Kind`])}catch(error){document.querySelector('#copyStatus').textContent=labels.failure}}
function render(){if(!schema)return;const t=copy[lang]||copy.zh;document.documentElement.lang=lang==='zh'?'zh-Hant':lang;document.title=`${t.title} · ${lang==='en'?'Taiwan Hotel Rate Intelligence':'台灣飯店房價查詢平台'}`;document.querySelector('#title').textContent=t.title;document.querySelector('#lede').textContent=t.lede;document.querySelector('#latestLink').textContent=t.latest;document.querySelector('#historyLink').textContent=t.history;document.querySelector('#schemaJson').textContent={zh:'下載 schema JSON',en:'Download schema JSON',ja:'schema JSONをダウンロード'}[lang];document.querySelector('#summary').innerHTML=[schema.schema_version,schema.formats.join(' / '),schema.field_groups.length].map((value,index)=>`<div><b>${esc(value)}</b><span>${esc(t.summary[index])}</span></div>`).join('');document.querySelector('#scopeTitle').textContent=t.scopeTitle;document.querySelector('#scopes').innerHTML=schema.scopes.map(item=>`<div class="scope"><strong><code>${esc(item.key)}</code></strong><small>${esc(t.scope[item.key])}</small><small>${esc(item.applies_to)}</small></div>`).join('');document.querySelector('#valueTitle').textContent=t.valueTitle;document.querySelector('#rules').innerHTML=t.rules.map(rule=>`<li>${esc(rule)}</li>`).join('');document.querySelector('#strictNote').textContent=t.strictNote;renderColumnOrder();document.querySelector('#fieldTitle').textContent=t.fieldTitle;document.querySelector('#fields').innerHTML=schema.field_groups.map(group=>`<section class="field-group"><h3>${esc(t.groups[group.key][0])}</h3><p>${esc(t.groups[group.key][1])}</p><div class="field-list">${group.fields.map(field=>`<div class="field-card"><code>${esc(field)}</code><small>${esc(fieldMeta(field))}</small></div>`).join('')}</div></section>`).join('');document.querySelector('#footer').textContent=t.footer;document.querySelectorAll('[data-lang]').forEach(button=>button.setAttribute('aria-pressed',String(button.dataset.lang===lang)))}
document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{lang=button.dataset.lang;localStorage.setItem('hotel-lang',lang);document.querySelector('#copyStatus').textContent='';render()}));document.querySelectorAll('[data-copy-columns]').forEach(button=>button.addEventListener('click',()=>copyColumns(button.dataset.copyColumns)));fetch('./export-schema.json').then(response=>{if(!response.ok)throw new Error(`Schema ${response.status}`);return response.json()}).then(data=>{schema=data;render()}).catch(error=>{document.querySelector('#lede').textContent=error.message});
</script>
<script type="module" src="./assets/js/site-meta.js"></script>
</body>
</html>
