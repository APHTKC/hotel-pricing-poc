zh:{title:'匯出資料字典',lede:'最新頁與歷史頁共用此一 schema 1.1 說明。它定義匯出範圍、缺值語意、strict 比較欄位與來源證據，避免把篩選結果誤認為完整倉庫。',latest:'最新房價',history:'歷史分析',summary:['Schema 版本','支援格式','欄位群組'],scopeTitle:'資料範圍',valueTitle:'值與缺值規則',rules:['JSON 的 null 與 CSV 的空白儲存格皆表示來源沒有可驗證值。','字串 unknown 是明確的「未知」分類，不等於 false、零或未提供。','布林 true／false 保持機器可分析格式；數值欄位不加幣別符號。','display_* 欄位依使用者選取幣別換算；TWD 正規化欄位不受畫面幣別影響。','CSV 文字若以 =、+、-、@ 開頭會加前置單引號，避免試算表公式注入。'],strictNote:'strict_parity_eligible 只有在飯店、日期、入住人數、房型、早餐、取消、稅費與 24 小時查價窗皆可比時才為 true；不得用其他商品或來源補值。',fieldTitle:'明細欄位',footer:'JSONL 是權威來源；Parquet 僅為可重建的正規化分析鏡像。'},
en:{title:'Export data dictionary',lede:'The latest and history pages share this schema 1.1 reference. It defines export scopes, missing-value semantics, strict-comparison fields, and source evidence so filtered rows are not mistaken for the full warehouse.',latest:'Latest rates',history:'History analysis',summary:['Schema version','Formats','Field groups'],scopeTitle:'Data scopes',valueTitle:'Value and missing-data rules',rules:['JSON null and an empty CSV cell mean the source has no verifiable value.','The string unknown is an explicit unknown category; it is not false, zero, or omitted.','Boolean true/false and finite numbers remain machine-readable; numeric fields omit currency symbols.','display_* fields use the selected display currency; normalized TWD fields do not change with the UI currency.','CSV text beginning with =, +, -, or @ receives a leading apostrophe to prevent spreadsheet formula injection.'],strictNote:'strict_parity_eligible is true only when hotel, dates, occupancy, room, breakfast, cancellation, tax treatment, and the 24-hour query window are comparable. Values are never borrowed from another product or source.',fieldTitle:'Detail fields',footer:'JSONL is authoritative; Parquet is a rebuildable normalized analytics mirror.'},
ja:{title:'出力データ辞書',lede:'最新ページと履歴ページで共通の schema 1.1 リファレンスです。出力範囲、欠損値、strict 比較項目、出典証拠を定義し、絞り込み結果と全履歴ウェアハウスの混同を防ぎます。',latest:'最新料金',history:'履歴分析',summary:['Schema バージョン','対応形式','項目グループ'],scopeTitle:'データ範囲',valueTitle:'値と欠損のルール',rules:['JSON の null と CSV の空セルは、検証可能な値が出典にないことを示します。','文字列 unknown は明示的な不明区分で、false、ゼロ、省略とは異なります。','真偽値 true／false と有限数値は分析可能な形式を維持し、数値欄に通貨記号は付けません。','display_* は選択通貨による換算値です。TWD 正規化項目は画面通貨の影響を受けません。','=、+、-、@ で始まる CSV 文字列には、数式注入防止のため先頭にアポストロフィを付けます。'],strictNote:'strict_parity_eligible は、ホテル、日付、人数、客室、朝食、キャンセル、税、24時間以内の検索がすべて比較可能な場合のみ true です。別商品・別ソースから値を補完しません。',fieldTitle:'明細項目',footer:'JSONL が正本で、Parquet は再構築可能な正規化分析ミラーです。'}
};

document.querySelectorAll('[data-lang]').forEach(button=>button.addEventListener('click',()=>{lang=button.dataset.lang;localStorage.setItem('hotel-lang',lang);document.querySelector('#copyStatus').textContent='';clearFilterActionStatus();render()}));document.querySelectorAll('[data-copy-columns]').forEach(button=>button.addEventListener('click',()=>copyColumns(button.dataset.copyColumns)));document.querySelector('#fieldSearch').addEventListener('input',()=>{if(!schema)return;clearFilterActionStatus();syncFieldFilterUrl();renderActiveFilters();renderFields()});for(const id of['#fieldOutput','#fieldType','#fieldValue','#fieldApplicability'])document.querySelector(id).addEventListener('change',()=>{if(!schema)return;clearFilterActionStatus();syncFieldFilterUrl();renderActiveFilters();renderFields()});document.querySelector('#activeFilters').addEventListener('click',event=>{const button=event.target.closest('[data-clear-filter]');if(button&&schema)clearActiveFilter(button.dataset.clearFilter)});document.querySelector('#fields').addEventListener('click',event=>{const linkButton=event.target.closest('[data-copy-field-link]'),definitionButton=event.target.closest('[data-copy-field-definition]'),downloadButton=event.target.closest('[data-download-field-definition]');if(linkButton&&schema)copyFieldLink(linkButton.dataset.copyFieldLink);if(definitionButton&&schema)copyFieldDefinition(definitionButton.dataset.copyFieldDefinition);if(downloadButton&&schema)downloadFieldDefinition(downloadButton.dataset.downloadFieldDefinition)});document.querySelector('#resetFields').addEventListener('click',()=>schema&&resetFieldFilters());document.querySelector('#copyFilterLink').addEventListener('click',()=>schema&&copyFieldFilterLink());document.querySelector('#copyMatchingFields').addEventListener('click',()=>schema&&copyMatchingFieldNames());document.querySelector('#downloadFilteredSchema').addEventListener('click',()=>schema&&downloadFilteredSchemaSubset());document.querySelector('#scopes').addEventListener('click',event=>{const linkButton=event.target.closest('[data-copy-scope-link]'),definitionButton=event.target.closest('[data-copy-scope-definition]'),downloadButton=event.target.closest('[data-download-scope-definition]');if(linkButton&&schema)copyScopeLink(linkButton.dataset.copyScopeLink);if(definitionButton&&schema)copyScopeDefinition(definitionButton.dataset.copyScopeDefinition);if(downloadButton&&schema)downloadScopeDefinition(downloadButton.dataset.downloadScopeDefinition)});window.addEventListener('hashchange',handleSchemaHashChange);restoreFieldFilters();fetch('./export-schema.json').then(response=>{if(!response.ok)throw new Error(`Schema ${response.status}`);return response.json()}).then(data=>{schema=data;render()}).catch(error=>{document.querySelector('#lede').textContent=error.message});
